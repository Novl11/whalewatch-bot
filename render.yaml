services:
  - type: web
    name: whalewatch-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "0"
      - key: PRO_DURATION_DAYS
        value: "30"
      - key: PRO_PRICE_USDT
        value: "10"
      - key: USDT_WALLET
        value: ""
      - key: TRONGRID_API_KEY
        value: ""
